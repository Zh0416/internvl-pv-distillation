  counts:
    train:
      regular_positive: 300
      hard_positive: 100
      hard_negative: 70
    validation:
      regular_positive: 40
      hard_positive: 20
      hard_negative: 15
    test:
      regular_positive: 20
      hard_positive: 15
      hard_negative: 15
  sample_weights:
    regular_positive: 1.0
    hard_positive: 1.5
    hard_negative: 2.0
  student:
    name: nvidia/segformer-b0-finetuned-ade-512-512
    image_size: 512
    batch_size: 4
    gradient_accumulation_steps: 2
    epochs: 8
    learning_rate: 0.00006
    weight_decay: 0.01
    num_workers: 2
    threshold: 0.5
    focal_weight: 0.6
    dice_weight: 0.4
    presence_supervision_weight: 0.1
    semantic_kd_weight: 0.2
    feature_kd_weight: 0.1
    semantic_agreement_threshold: 0.5
runtime:
  output_dir: /kaggle/working/outputs
  retry_count: 1
  save_feature_dtype: float16
